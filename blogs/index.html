<section id="story" data-section="story" style="max-width: 1200px; margin: 0 auto; padding: clamp(6px, 2cqi, 24px) clamp(20px, 4cqi, 40px) clamp(56px, 7cqi, 104px); scroll-margin-top: 88px">

</div>
<div style="margin-top: clamp(28px, 4cqi, 52px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: clamp(16px, 2cqi, 28px)">

<p style="margin: 0; font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: clamp(20px, 2.1cqi, 26px); line-height: 1.38; color: #152248; text-wrap: pretty">An owner of an HVAC company lost their general manager over equity.</p>
<p style="margin: 14px 0 0; font-size: 16px; line-height: 1.65; color: #3D4768; text-wrap: pretty">The person who knew the business best walked away, and the owner had to return to day-to-day operations.</p>

<figure class="card rv" style="margin: 0; background: #F7F7F3; border: 1px solid #D9DBD2; border-radius: 12px; padding: clamp(22px, 2.6cqi, 32px); display: flex; flex-direction: column">

<p style="margin: 14px 0 0; font-size: 16px; line-height: 1.65; color: #3D4768; text-wrap: pretty">He decided to build his next businesses on his own, and vowed not to build with anyone else again.</p>

<div class="rv" style="margin-top: clamp(16px, 2cqi, 28px); background: #152248; border-radius: clamp(14px, 1.6cqi, 20px); padding: clamp(26px, 3.4cqi, 48px)">

<section id="faq" class="faqbg" data-section="faq" style="scroll-margin-top: 76px">
<canvas class="fx" data-ink="#4A6FA5" ref="{{ starsC }}" aria-hidden="true"></canvas>
<div style="position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: clamp(64px, 8cqi, 112px) clamp(20px, 4cqi, 40px)">
<div style="display: flex; flex-wrap: wrap; gap: clamp(28px, 6cqi, 88px)">
<div class="rv" style="flex: 1 1 300px; min-width: 0">
<div style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 500; font-size: 12.5px; letter-spacing: 0.12em; color: #566082">QUESTIONS</div>
<h2 style="margin: 16px 0 0; font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: clamp(30px, 3.6cqi, 46px); line-height: 1.2; color: #152248; letter-spacing: -0.015em; text-wrap: balance">Straight answers.</h2>
<p style="margin: 18px 0 0; max-width: 340px; font-size: 16.5px; line-height: 1.6; color: #3D4768">If yours is not here, ask it on the call.</p>
</div>
<div class="rv" style="flex: 2 1 520px; min-width: 0; border-top: 1px solid #D9DBD2">
<details class="faq" style="border-bottom: 1px solid #D9DBD2">
<summary style="display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 0; min-height: 44px"><span class="q" style="font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: clamp(17px, 1.7cqi, 20px); line-height: 1.4; color: #152248">What is phantom equity?</span><svg class="pm" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#152248" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" style="flex: none"><line x1="9" y1="2" x2="9" y2="16"></line><line x1="2" y1="9" x2="16" y2="9"></line></svg></summary>
<p style="margin: 0; padding: 0 44px 24px 0; font-size: 16.5px; line-height: 1.65; color: #3D4768">A bonus plan tied to what your company is worth. You give a key person units that follow the company's value, but they are not shares. When the payout moment you choose arrives, their vested units are paid out in cash, based on how much the company's value has grown since the units were granted. You decide how the plan works, including what triggers the payout.</p>
</details>
<details class="faq" style="border-bottom: 1px solid #D9DBD2">
<summary style="display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 0; min-height: 44px"><span class="q" style="font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: clamp(17px, 1.7cqi, 20px); line-height: 1.4; color: #152248">Why phantom equity instead of real equity or a bonus?</span><svg class="pm" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#152248" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" style="flex: none"><line x1="9" y1="2" x2="9" y2="16"></line><line x1="2" y1="9" x2="16" y2="9"></line></svg></summary>
<p style="margin: 0; padding: 0 44px 24px 0; font-size: 16.5px; line-height: 1.65; color: #3D4768">Real equity means giving up a piece of your company, with the voting rights and paperwork that come with it. A cash bonus is paid once and does not grow with the company. Phantom equity sits between the two: your key person shares in the growth in value, and you keep your ownership.</p>
</details>
<details class="faq" style="border-bottom: 1px solid #D9DBD2">
<summary style="display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 0; min-height: 44px"><span class="q" style="font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: clamp(17px, 1.7cqi, 20px); line-height: 1.4; color: #152248">Do I give up any ownership?</span><svg class="pm" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#152248" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" style="flex: none"><line x1="9" y1="2" x2="9" y2="16"></line><line x1="2" y1="9" x2="16" y2="9"></line></svg></summary>
<p style="margin: 0; padding: 0 44px 24px 0; font-size: 16.5px; line-height: 1.65; color: #3D4768">No. Phantom units are paid in cash, as wages on a W-2. They are not ownership in the company, so no shares and no voting rights are given up.</p>
</details>
<details class="faq" style="border-bottom: 1px solid #D9DBD2">
<summary style="display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 0; min-height: 44px"><span class="q" style="font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: clamp(17px, 1.7cqi, 20px); line-height: 1.4; color: #152248">Do I have to file any extra tax forms?</span><svg class="pm" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#152248" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" style="flex: none"><line x1="9" y1="2" x2="9" y2="16"></line><line x1="2" y1="9" x2="16" y2="9"></line></svg></summary>
<p style="margin: 0; padding: 0 44px 24px 0; font-size: 16.5px; line-height: 1.65; color: #3D4768">No. The payout is taxed as regular payroll at the time it is paid, and it appears on the employee's W-2 like the rest of their pay.</p>
</details>
<details class="faq" style="border-bottom: 1px solid #D9DBD2">
<summary style="display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 0; min-height: 44px"><span class="q" style="font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: clamp(17px, 1.7cqi, 20px); line-height: 1.4; color: #152248">Who is Aequi for?</span><svg class="pm" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#152248" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" style="flex: none"><line x1="9" y1="2" x2="9" y2="16"></line><line x1="2" y1="9" x2="16" y2="9"></line></svg></summary>
<p style="margin: 0; padding: 0 44px 24px 0; font-size: 16.5px; line-height: 1.65; color: #3D4768">Owners of small to medium-sized companies, such as LLCs, who want to keep the people they cannot afford to lose: a general manager, a lead, a department head, a regional manager. It also fits owners who run more than one business, such as franchise owners, management companies like property managers, and portfolio companies. It fits businesses across Main Street, from trades and hotels to practices, studios and shops.</p>
</details>
<details class="faq" style="border-bottom: 1px solid #D9DBD2">
<summary style="display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 0; min-height: 44px"><span class="q" style="font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: clamp(17px, 1.7cqi, 20px); line-height: 1.4; color: #152248">When does the payout happen?</span><svg class="pm" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#152248" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" style="flex: none"><line x1="9" y1="2" x2="9" y2="16"></line><line x1="2" y1="9" x2="16" y2="9"></line></svg></summary>
<div style="padding: 0 44px 24px 0">
<p style="margin: 0; font-size: 16.5px; line-height: 1.65; color: #3D4768">You choose the payout moment when you set up each plan. This is called the triggering event: the moment you decide that a plan pays out. When it arrives, each person's vested units are paid in cash, based on how much the company's value has grown since their grant.</p>
</div>
</details>
<details class="faq" style="border-bottom: 1px solid #D9DBD2">
<summary style="display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 0; min-height: 44px"><span class="q" style="font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: clamp(17px, 1.7cqi, 20px); line-height: 1.4; color: #152248">What happens if someone leaves before they vest?</span><svg class="pm" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#152248" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" style="flex: none"><line x1="9" y1="2" x2="9" y2="16"></line><line x1="2" y1="9" x2="16" y2="9"></line></svg></summary>
<div style="padding: 0 44px 24px 0">
<p style="margin: 0; font-size: 16.5px; line-height: 1.65; color: #3D4768">Units vest over time, with a cliff you set. Units that have not vested when someone leaves are not paid out. What happens to units that have already vested depends on the rules you set in the agreement.</p>
</div>
</details>
<details class="faq" style="border-bottom: 1px solid #D9DBD2">
<summary style="display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 0; min-height: 44px"><span class="q" style="font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: clamp(17px, 1.7cqi, 20px); line-height: 1.4; color: #152248">What do all of these words mean?</span><svg class="pm" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#152248" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" style="flex: none"><line x1="9" y1="2" x2="9" y2="16"></line><line x1="2" y1="9" x2="16" y2="9"></line></svg></summary>
<dl style="margin: 0; padding: 0 0 26px 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 12px">
<div style="background: #FCFCF9; border: 1px solid #D9DBD2; border-radius: 8px; padding: 16px 18px"><dt style="font-weight: 700; font-size: 16px; color: #152248">Units</dt><dd style="margin: 6px 0 0; font-size: 15.5px; line-height: 1.6; color: #3D4768">The building blocks of a plan. Each unit follows the company's value, but it is not a share of ownership.</dd></div>
<div style="background: #FCFCF9; border: 1px solid #D9DBD2; border-radius: 8px; padding: 16px 18px"><dt style="font-weight: 700; font-size: 16px; color: #152248">Grant</dt><dd style="margin: 6px 0 0; font-size: 15.5px; line-height: 1.6; color: #3D4768">When you award someone a set number of units.</dd></div>
<div style="background: #FCFCF9; border: 1px solid #D9DBD2; border-radius: 8px; padding: 16px 18px"><dt style="font-weight: 700; font-size: 16px; color: #152248">Base price</dt><dd style="margin: 6px 0 0; font-size: 15.5px; line-height: 1.6; color: #3D4768">The price of a unit on the day of the grant. Someone is paid only for growth above it.</dd></div>
<div style="background: #FCFCF9; border: 1px solid #D9DBD2; border-radius: 8px; padding: 16px 18px"><dt style="font-weight: 700; font-size: 16px; color: #152248">Valuation</dt><dd style="margin: 6px 0 0; font-size: 15.5px; line-height: 1.6; color: #3D4768">An estimate of what your company is worth. It sets the base price.</dd></div>
<div style="background: #FCFCF9; border: 1px solid #D9DBD2; border-radius: 8px; padding: 16px 18px"><dt style="font-weight: 700; font-size: 16px; color: #152248">Vesting</dt><dd style="margin: 6px 0 0; font-size: 15.5px; line-height: 1.6; color: #3D4768">Earning your units over time, instead of all at once.</dd></div>
<div style="background: #FCFCF9; border: 1px solid #D9DBD2; border-radius: 8px; padding: 16px 18px"><dt style="font-weight: 700; font-size: 16px; color: #152248">Vesting schedule</dt><dd style="margin: 6px 0 0; font-size: 15.5px; line-height: 1.6; color: #3D4768">How long vesting takes and how it is paced, for example over 4 years. Also called the vesting period.</dd></div>
<div style="background: #FCFCF9; border: 1px solid #D9DBD2; border-radius: 8px; padding: 16px 18px"><dt style="font-weight: 700; font-size: 16px; color: #152248">Cliff</dt><dd style="margin: 6px 0 0; font-size: 15.5px; line-height: 1.6; color: #3D4768">A waiting period before any units vest. With a 1-year cliff, nothing vests until the first anniversary, and then the units earned so far vest at once.</dd></div>
<div style="background: #FCFCF9; border: 1px solid #D9DBD2; border-radius: 8px; padding: 16px 18px"><dt style="font-weight: 700; font-size: 16px; color: #152248">Vested and unvested</dt><dd style="margin: 6px 0 0; font-size: 15.5px; line-height: 1.6; color: #3D4768">Vested units are earned. Unvested units are not earned yet.</dd></div>
<div style="background: #FCFCF9; border: 1px solid #D9DBD2; border-radius: 8px; padding: 16px 18px"><dt style="font-weight: 700; font-size: 16px; color: #152248">Triggering event</dt><dd style="margin: 6px 0 0; font-size: 15.5px; line-height: 1.6; color: #3D4768">The moment you choose for a plan to pay out. It can be a set date, a milestone, or a major liquidity event, such as the sale of your company.</dd></div>
<div style="background: #FCFCF9; border: 1px solid #D9DBD2; border-radius: 8px; padding: 16px 18px"><dt style="font-weight: 700; font-size: 16px; color: #152248">Payout</dt><dd style="margin: 6px 0 0; font-size: 15.5px; line-height: 1.6; color: #3D4768">The cash paid at the triggering event: the growth above the base price, on each vested unit.</dd></div>
<div style="background: #FCFCF9; border: 1px solid #D9DBD2; border-radius: 8px; padding: 16px 18px"><dt style="font-weight: 700; font-size: 16px; color: #152248">Equity pool</dt><dd style="margin: 6px 0 0; font-size: 15.5px; line-height: 1.6; color: #3D4768">The total number of units you set aside to give to your people.</dd></div>
</dl>
</details>
<details class="faq" style="border-bottom: 1px solid #D9DBD2">
<summary style="display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 0; min-height: 44px"><span class="q" style="font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: clamp(17px, 1.7cqi, 20px); line-height: 1.4; color: #152248">What happens after I book?</span><svg class="pm" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#152248" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" style="flex: none"><line x1="9" y1="2" x2="9" y2="16"></line><line x1="2" y1="9" x2="16" y2="9"></line></svg></summary>
<p style="margin: 0; padding: 0 44px 24px 0; font-size: 16.5px; line-height: 1.65; color: #3D4768">You choose a time for a 30-minute call with both founders. We ask about your company and the people you want to keep, show you the product, and go through pricing. There is nothing to prepare. If it looks like a fit, we talk about joining the closed beta.</p>
</details>

<h1 class="in" style="margin: 18px 0 0; max-width: 900px; font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: clamp(34px, 5cqi, 66px); line-height: 1.12; color: #152248; letter-spacing: -0.02em; text-wrap: balance; animation-delay: .08s">The people behind Aequi<span class="dotc" style="color: #7F8AAD">.</span></h1>
<p class="in" style="margin: 26px 0 0; max-width: 680px; font-size: clamp(18px, 1.8cqi, 22px); line-height: 1.6; color: #3D4768; animation-delay: .16s">We are identical twins from Ocala, Florida, building Aequi for the small and medium businesses that most software overlooks.</p>
</section>
<section data-section="story" style="max-width: 1200px; margin: 0 auto; padding: clamp(40px, 5cqi, 64px) clamp(20px, 4cqi, 40px) clamp(64px, 8cqi, 112px)">
<div class="rv" style="display: flex; flex-wrap: wrap; gap: clamp(28px, 5cqi, 72px); align-items: flex-start">
<div style="flex: 1 1 320px; min-width: 0; max-width: 460px">
<div style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 500; font-size: 12.5px; letter-spacing: 0.12em; color: #566082">OUR STORY</div>
<h2 style="margin: 16px 0 0; font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: clamp(28px, 3.4cqi, 42px); line-height: 1.2; color: #152248; letter-spacing: -0.015em; text-wrap: balance">We grew up around small businesses<span class="dotc" style="color: #7F8AAD">.</span></h2>
</div>
<div style="flex: 1.3 1 420px; min-width: 0; max-width: 640px; display: flex; flex-direction: column; gap: 18px">
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #3D4768">We grew up in Ocala, a rural part of Central Florida, watching our family run small businesses.</p>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #3D4768">Together we started a landscaping company and built profit sharing into it. We learned early that giving people a stake in the results changes how they work.</p>
<blockquote style="margin: 6px 0; padding-left: 20px; border-left: 3px solid #4A6FA5">
<p style="margin: 0; font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: 21px; line-height: 1.45; color: #152248">&ldquo;You guys are going to go off to great colleges and get great offers, but I wish we could offer you guys something to get you guys to come back to us.&rdquo;</p>
</blockquote>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #3D4768">Our senior year civil engineering internship concluded with this one sentence, which got us thinking: across our family and the businesses around us, losing good employees was accepted as part of doing business. It does not have to be that way. Many of those departures are preventable, and owners do not have to lose their top people.</p>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #3D4768">When we moved to New York City in the fall of 2025 to attend Columbia University, we saw that nearly everyone was building for AI and the next mega-corporation. Equity incentives are a standard way for tech companies, startups, and large corporations to keep their top talent. Small businesses, and LLCs in particular, rarely have access to them, and almost no one is building for them. These are the businesses at the center of American commerce, which, <a href="https://advocacy.sba.gov/wp-content/uploads/2025/06/United_States_2025-State-Profile.pdf" target="_blank" rel="noopener noreferrer" style="color: #152248; font-weight: 600; text-decoration: underline; text-underline-offset: 3px">according to the Small Business Administration</a>, make up 99.9% of U.S. businesses.</p>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #3D4768">Our mission is to give small and medium businesses the tools that the largest companies already use. Aequi is the product we wish everyone had.</p>
<div style="margin-top: 18px; display: flex; flex-wrap: wrap; gap: 28px 56px; align-items: flex-end">
<div class="sig">
<img src="/assets/nicholas.jpg" alt="Nicholas Rivera" style="display: block; width: 150px; aspect-ratio: 4 / 5; margin-bottom: 18px; border-radius: 12px; object-fit: cover; box-shadow: 0 0 0 1px rgba(21,34,72,0.1)">

<div class="in" style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 500; font-size: 12.5px; letter-spacing: 0.12em; color: #566082">PARTNERS</div>
<h1 class="in" style="margin: 18px 0 0; max-width: 900px; font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: clamp(34px, 5cqi, 66px); line-height: 1.12; color: #152248; letter-spacing: -0.02em; text-wrap: balance; animation-delay: .08s">Built for owners, and <span class="ulw">the advisors they trust</span><span class="dotc" style="color: #7F8AAD">.</span></h1>
<p class="in" style="margin: 26px 0 0; max-width: 680px; font-size: clamp(18px, 1.8cqi, 22px); line-height: 1.6; color: #3D4768; animation-delay: .16s">Add phantom equity to the services you already provide. Aequi partners with accounting practices, PEOs, benefits and insurance advisors, and appraisers, so your clients keep the people their businesses depend on.</p>
</section>
<section style="max-width: 1200px; margin: 0 auto; padding: clamp(40px, 5cqi, 64px) clamp(20px, 4cqi, 40px) clamp(64px, 8cqi, 112px)">
<ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(250px, 100%), 1fr)); gap: 20px">

<h3 style="margin: 0; font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: 21px; line-height: 1.3; color: #152248">CPAs</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.65; color: #3D4768">Answer the bonus plan question with a record. Units, vesting dates and payouts for each plan live in one place, shared with your client. Offer plan administration as an added service.</p>
</li><li class="card rv" style="background: #FCFCF9; border: 1px solid #D9DBD2; border-radius: 12px; padding: 26px 24px 30px; display: flex; flex-direction: column; gap: 12px">
<h3 style="margin: 0; font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: 21px; line-height: 1.3; color: #152248">PEOs</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.65; color: #3D4768">Add retention to your service menu. A phantom equity plan pays in cash and transfers no ownership, so it reaches clients where salary and benefits stop. Keep their key people, and the worksite employee counts and per-employee revenue that come with them.</p>

<div data-page="privacy">
<section style="max-width: 1200px; margin: 0 auto; padding: clamp(56px, 8cqi, 112px) clamp(20px, 4cqi, 40px) clamp(64px, 8cqi, 112px)">
<div class="in" style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 500; font-size: 12.5px; letter-spacing: 0.12em; color: #566082">LEGAL</div>
<h1 class="in" style="margin: 16px 0 0; font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: clamp(34px, 4.6cqi, 60px); line-height: 1.1; color: #152248; letter-spacing: -0.02em; animation-delay: .08s">Privacy Policy<span style="color: #7F8AAD">.</span></h1>
<div style="max-width: 760px; margin-top: 36px">
<p style="margin: 14px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">Aequi Inc. (“Aequi,” “we,” “us,” and “our”) is committed to protecting your privacy. This Privacy Policy explains what information we collect when you visit joinaequi.com (the “Site”) or ask to book a demo, how we use and share it, and the choices you have. “You” means you, as a visitor to the Site.</p>
<p style="margin: 14px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">This Privacy Policy covers the Site and our demo scheduling. If you join our closed beta, we will give you additional terms that explain how information inside the product is handled.</p>
<p style="margin: 14px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">By using the Site, you accept this Privacy Policy and our <a href="#terms" onClick="{{ navTerms }}" style="color: #4A6FA5; font-weight: 600; text-decoration: none">Terms of Use</a>, and you consent to our collection, storage, use and disclosure of your Personal Information as described here. If you do not agree, please do not use the Site.</p>
<h2 style="margin: 44px 0 0; font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.3; color: #152248">I. Information we collect</h2>
<p style="margin: 14px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">We collect “Personal Information” and “Non-Personal Information.” Personal Information can be used to identify you. Non-Personal Information cannot.</p>
<h3 style="margin: 24px 0 0; font-size: 17px; font-weight: 700; line-height: 1.4; color: #152248">Information you give us</h3>
<p style="margin: 10px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">When you ask to book a demo, we collect your name, your work email address, and whether you are a business owner or an advisor. If you email us, we collect your email address and anything you include in your message. When you choose a time on our calendar, the scheduling tool also collects the details you enter there.</p>
<h3 style="margin: 24px 0 0; font-size: 17px; font-weight: 700; line-height: 1.4; color: #152248">Information collected automatically</h3>
<p style="margin: 10px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">When you view the Site, your browser and device give us information that does not identify you personally, such as the website you came from (the “referring URL”), your browser type, your device, the time and date of your visit, the pages you view, your approximate location based on your IP address, and your number of clicks. We collect this through analytics cookies only if you allow them, as described below. Our hosting provider may also keep basic server logs.</p>
<h3 style="margin: 24px 0 0; font-size: 17px; font-weight: 700; line-height: 1.4; color: #152248">Cookies</h3>
<p style="margin: 10px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">Cookies are small text files that a website stores in your browser. We use two kinds of storage. First, we save your cookie choice in your browser so that we do not ask you again on every visit. Second, if you click Accept in our cookie notice, we load Google Analytics, which uses cookies to help us understand how people use the Site. If you click Decline, we do not load Google Analytics.</p>
<p style="margin: 14px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">Persistent cookies stay on your device until you delete them or they expire. Session cookies expire when you close your browser. You can change your choice at any time with “Cookie settings” at the bottom of the Site, and you can delete or block cookies in your browser settings.</p>
<h3 style="margin: 24px 0 0; font-size: 17px; font-weight: 700; line-height: 1.4; color: #152248">Children’s privacy</h3>
<p style="margin: 10px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">The Site is meant for business owners and advisors and is not directed to anyone under the age of 18. We do not knowingly collect information from anyone under 18. If we learn that we have collected information from someone under 18, we will delete it as soon as possible. If you believe we have, please contact us at <a href="mailto:info@joinaequi.com" style="color: #4A6FA5; font-weight: 600; text-decoration: none">info@joinaequi.com</a>.</p>
<h2 style="margin: 44px 0 0; font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.3; color: #152248">II. How we use and share information</h2>
<h3 style="margin: 24px 0 0; font-size: 17px; font-weight: 700; line-height: 1.4; color: #152248">Personal Information</h3>
<p style="margin: 10px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">We use the Personal Information you give us to reply to your requests, schedule and hold demo calls, follow up with you about your demo and our closed beta, and answer your questions.</p>
<p style="margin: 14px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">We do not sell your Personal Information, and we do not rent it or share it with third parties for marketing without your consent. We do share it with service providers that perform services for us, such as Google, which provides our scheduling tool, our email and, if you accept, our analytics; Formspree, which handles our demo request form; and the provider that hosts the Site. These providers may use your Personal Information only to provide their services to us and under their own privacy policies.</p>
<p style="margin: 14px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">We may also share Personal Information if we have a good-faith belief that access, use, preservation or disclosure is reasonably necessary to meet any applicable legal process or enforceable governmental request; to enforce our Terms of Use, including investigation of potential violations; to address fraud, security or technical concerns; or to protect against harm to the rights, property or safety of our users or the public, as required or permitted by law.</p>
<h3 style="margin: 24px 0 0; font-size: 17px; font-weight: 700; line-height: 1.4; color: #152248">Non-Personal Information</h3>
<p style="margin: 10px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">We use Non-Personal Information to improve the Site and understand how it is used. We combine it with information from other visitors to track trends and usage patterns.</p>
<p style="margin: 14px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">If we go through a business transaction such as a merger, acquisition by another company, or sale of all or part of our assets, your Personal Information may be among the assets transferred. You acknowledge and consent that such transfers may occur and are permitted by this Privacy Policy, and that any acquirer of our assets may continue to process your Personal Information as described here.</p>
<h2 style="margin: 44px 0 0; font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.3; color: #152248">III. Third-party services</h2>
<h3 style="margin: 24px 0 0; font-size: 17px; font-weight: 700; line-height: 1.4; color: #152248">Google Analytics</h3>
<p style="margin: 10px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">If you accept analytics cookies, we use Google Analytics, a web analytics service provided by Google LLC. Google Analytics uses cookies to collect information about how you use the Site, such as the pages you visit and how long you stay. Google processes this information on our behalf and under its own privacy policy. We do not use Google Analytics for advertising.</p>
<p style="margin: 14px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">To learn how Google uses information from sites that use its services, visit <a href="https://policies.google.com/technologies/partner-sites" target="_blank" rel="noopener noreferrer" style="color: #4A6FA5; font-weight: 600; text-decoration: none">policies.google.com/technologies/partner-sites</a>. You can also install Google’s browser add-on to opt out of Google Analytics at <a href="https://tools.google.com/dlpage/gaoptout" target="_blank" rel="noopener noreferrer" style="color: #4A6FA5; font-weight: 600; text-decoration: none">tools.google.com/dlpage/gaoptout</a>.</p>
<h3 style="margin: 24px 0 0; font-size: 17px; font-weight: 700; line-height: 1.4; color: #152248">Demo request form</h3>
<p style="margin: 10px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">When you submit our demo request form, we use Formspree, a form service, to receive your name, work email address and role (business owner or advisor) and pass them to us. Formspree processes this information on our behalf and under its own privacy policy at <a href="https://formspree.io/legal/privacy-policy" target="_blank" rel="noopener noreferrer" style="color: #4A6FA5; font-weight: 600; text-decoration: none">formspree.io/legal/privacy-policy</a>.</p>
<h3 style="margin: 24px 0 0; font-size: 17px; font-weight: 700; line-height: 1.4; color: #152248">Booking a demo</h3>
<p style="margin: 10px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">We use a Google Calendar booking page to schedule demo calls. When you book, Google receives the details you enter, such as your name, email address and the time you choose, and shares them with us. Google handles that information under the Google Privacy Policy at <a href="https://policies.google.com/privacy" target="_blank" rel="noopener noreferrer" style="color: #4A6FA5; font-weight: 600; text-decoration: none">policies.google.com/privacy</a>.</p>
<h2 style="margin: 44px 0 0; font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.3; color: #152248">IV. Your choices and rights</h2>
<p style="margin: 14px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768"><strong style="color: #152248">Cookies.</strong> You can accept or decline analytics cookies in our cookie notice and change your choice at any time with “Cookie settings” at the bottom of the Site.</p>
<p style="margin: 14px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768"><strong style="color: #152248">Follow-up emails.</strong> You can ask us at any time to stop contacting you by replying to any of our emails or writing to <a href="mailto:info@joinaequi.com" style="color: #4A6FA5; font-weight: 600; text-decoration: none">info@joinaequi.com</a>. We may still send you administrative messages, such as updates to this Privacy Policy.</p>
<p style="margin: 14px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768"><strong style="color: #152248">Access, correction and deletion.</strong> You can ask us what Personal Information we hold about you, ask us to correct it, or ask us to delete it by emailing us. Depending on where you live in the United States, you may have additional rights under your state’s privacy law, and we will respond to your requests as the law requires.</p>
<p style="margin: 14px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768"><strong style="color: #152248">Do Not Track.</strong> Because there is no common standard, the Site does not currently respond to Do Not Track signals from browsers.</p>
<h2 style="margin: 44px 0 0; font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.3; color: #152248">V. How we protect and keep information</h2>
<p style="margin: 14px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">We use reasonable measures designed to protect your information from unauthorized access, loss and misuse. However, no website or method of transmission is completely secure, and we cannot guarantee that your information will never be accessed, disclosed, altered or destroyed. By using the Site, you acknowledge and accept this risk.</p>
<p style="margin: 14px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">We keep Personal Information only as long as we need it for the purposes described in this Privacy Policy, unless the law requires us to keep it longer.</p>
<h2 style="margin: 44px 0 0; font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.3; color: #152248">VI. Links to other websites</h2>
<p style="margin: 14px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">The Site may link to other websites. We are not responsible for the privacy practices of those websites or the information or content they contain. This Privacy Policy applies only to information collected by us through the Site. It does not apply to your use of a third-party website that you reach by selecting a link on the Site. We encourage you to read the privacy statements of other websites before you use them.</p>
<h2 style="margin: 44px 0 0; font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.3; color: #152248">VII. Where we operate</h2>
<p style="margin: 14px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">The Site is operated from the United States and is directed to people in the United States. If you visit from another country, you understand that your information will be transferred to and processed in the United States.</p>
<h2 style="margin: 44px 0 0; font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.3; color: #152248">VIII. Changes to this Privacy Policy</h2>
<p style="margin: 14px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">We may change this Privacy Policy at any time. When we do, we will post the updated version on the Site and change the “Last Updated” date below. If we make significant changes, we will place a prominent notice on the Site, and those changes will take effect 30 days after the notice. Non-material changes and clarifications take effect when we post them. Please check this page from time to time.</p>
<h2 style="margin: 44px 0 0; font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.3; color: #152248">IX. Contact us</h2>
<p style="margin: 14px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">If you have any questions about this Privacy Policy or the practices of the Site, email us at <a href="mailto:info@joinaequi.com" style="color: #4A6FA5; font-weight: 600; text-decoration: none">info@joinaequi.com</a>.</p>
<p style="margin: 22px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768"><strong style="color: #152248">Last Updated:</strong> November 18, 2026</p>

<h2 style="margin: 44px 0 0; font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.3; color: #152248">II. What the Site is</h2>
<p style="margin: 14px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">The Site tells you about Aequi, software for phantom equity plans, which is in development and planned for a closed beta. The Site is for information only. Nothing on it is an offer to sell you anything or a promise that any product, feature or integration is available. Descriptions of features, timing and availability reflect our plans and may change. The companies, people, figures and screens shown on the Site are examples only.</p>
<h2 style="margin: 44px 0 0; font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.3; color: #152248">III. Not legal, tax or financial advice</h2>
<p style="margin: 14px 0 0; font-size: 16.5px; line-height: 1.7; color: #3D4768">Aequi is software. Nothing on the Site, on a demo call or in our product is legal, tax, accounting, investment or other professional advice, and we do not give any. Using the Site or speaking with us does not create an attorney-client or advisory relationship. Phantom equity plans can have legal and tax consequences. Please talk to your own attorney, tax advisor or accountant before you make decisions about a plan.</p>
<h2 style="margin: 44px 0 0; font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.3; color: #152248">IV. Demo requests</h2>
